name: Phase 0
on: [push, pull_request]
permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: roghyar
          POSTGRES_DB: roghyar
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U roghyar -d roghyar"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: apps/api
      ROGHYAR_ENVIRONMENT: test
      ROGHYAR_TEST_POSTGIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r apps/api/requirements-test.txt
      - run: python -m alembic -c apps/api/alembic.ini upgrade head
      - run: python -m pytest apps/api/tests
      - run: python -m alembic -c apps/api/alembic.ini downgrade base
      - run: python -m alembic -c apps/api/alembic.ini upgrade head
      - run: python -m roghyar.export_openapi contracts/openapi.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run generate:api
      - run: git diff --exit-code -- contracts/openapi.json apps/web/src/api.generated.ts
      - working-directory: apps/web
        run: npm run build
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: npm run test:e2e
