name: Phase 0
on: [push, pull_request]
permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
      postgis:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_USER: roghyar_ci
          POSTGRES_DB: roghyar_phase0_ci
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U roghyar_ci -d roghyar_phase0_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: apps/api
      ROGHYAR_ENVIRONMENT: test
      ROGHYAR_TEST_POSTGIS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r apps/api/requirements-test.txt
      - name: Verify live PostGIS and Alembic round trip
        env:
          ROGHYAR_DB_HOST: 127.0.0.1
          ROGHYAR_DB_PORT: ${{ job.services.postgis.ports[5432] }}
          ROGHYAR_DB_NAME: roghyar_phase0_ci
          ROGHYAR_DB_USER: roghyar_ci
          ROGHYAR_DB_PASSWORD: local-development-only
          ROGHYAR_TEST_REDIS_PORT: ${{ job.services.redis.ports[6379] }}
        shell: bash
        run: |
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m pytest -q -s apps/api/tests/test_postgis.py
          python -m alembic -c apps/api/alembic.ini downgrade 0012_booking_slot_governance
          ROGHYAR_POSTGIS_STATE=slots python -m pytest -q -s apps/api/tests/test_postgis.py | tee "$RUNNER_TEMP/bk03-migrations.log"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0011_otp_sessions
          ROGHYAR_POSTGIS_STATE=otp python -m pytest -q -s apps/api/tests/test_postgis.py | tee "$RUNNER_TEMP/bk02-migrations.log"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0010_doctor_governance
          ROGHYAR_POSTGIS_STATE=doctor python -m pytest -q -s apps/api/tests/test_postgis.py | tee "$RUNNER_TEMP/bk01-migrations.log"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0009_directory_governance
          ROGHYAR_POSTGIS_STATE=directory python -m pytest -q -s apps/api/tests/test_postgis.py | tee "$RUNNER_TEMP/loc05-migrations.log"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0008_hospital_autocomplete
          ROGHYAR_POSTGIS_STATE=autocomplete python -m pytest -q -s apps/api/tests/test_postgis.py | tee "$RUNNER_TEMP/loc04-migrations.log"
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0007_home_care_publication
          ROGHYAR_POSTGIS_STATE=publication python -m pytest -q -s apps/api/tests/test_postgis.py
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0006_formulary_attestation
          ROGHYAR_POSTGIS_STATE=formulary python -m pytest -q -s apps/api/tests/test_postgis.py
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0005_red_flag_attestation
          ROGHYAR_POSTGIS_STATE=red_flags python -m pytest -q -s apps/api/tests/test_postgis.py
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0004_assessments
          ROGHYAR_POSTGIS_STATE=assessments python -m pytest -q -s apps/api/tests/test_postgis.py
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0003_rls
          ROGHYAR_POSTGIS_STATE=rls python -m pytest -q -s apps/api/tests/test_postgis.py
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade 0002_core_schema
          ROGHYAR_POSTGIS_STATE=core python -m pytest -q -s apps/api/tests/test_postgis.py
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m pytest -q -s apps/api/tests/test_postgis.py apps/api/tests/test_database_security.py | tee -a "$RUNNER_TEMP/loc04-migrations.log" "$RUNNER_TEMP/bk01-migrations.log" "$RUNNER_TEMP/bk02-migrations.log" "$RUNNER_TEMP/bk03-migrations.log"
          python -m alembic -c apps/api/alembic.ini downgrade base
          ROGHYAR_POSTGIS_STATE=base python -m pytest -q -s apps/api/tests/test_postgis.py
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m pytest -s apps/api/tests --junitxml="$RUNNER_TEMP/phase3-backend.xml" | tee "$RUNNER_TEMP/phase2-backend.log"
      - run: python -m roghyar.export_openapi contracts/openapi.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run generate:api
      - run: git diff --exit-code -- contracts/openapi.json apps/web/src/api.generated.ts
      - working-directory: apps/web
        shell: bash
        run: npm run test:unit | tee "$RUNNER_TEMP/phase2-unit.log"
      - working-directory: apps/web
        run: npm run build
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        shell: bash
        run: |
          PLAYWRIGHT_JUNIT_OUTPUT_FILE="$RUNNER_TEMP/phase3-browser.xml" \
            npm run test:e2e -- --reporter=list,junit | tee "$RUNNER_TEMP/phase2-browser.log"
      - name: Bind Phase 2 acceptance to the exact verified head
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD"
          evidence="$RUNNER_TEMP/phase2-evidence.md"
          printf '## Phase 2 engineering verification\n\nTested commit: `%s`\n\n[Hosted run](%s/%s/actions/runs/%s) · [Acceptance report](%s/%s/blob/%s/docs/29_PHASE_2_ACCEPTANCE_REPORT.md)\n\n' \
            "$VERIFIED_HEAD" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERIFIED_HEAD" > "$evidence"
          printf '\n```text\n' >> "$evidence"
          grep -E 'synthetic benchmark|BE-06 benchmark|=+ [0-9]+ passed' "$RUNNER_TEMP/phase2-backend.log" >> "$evidence"
          grep -E '^# (pass|fail) ' "$RUNNER_TEMP/phase2-unit.log" >> "$evidence"
          grep -E '^ *[0-9]+ passed' "$RUNNER_TEMP/phase2-browser.log" >> "$evidence"
          printf '```\n' >> "$evidence"
          cat "$evidence" >> "$GITHUB_STEP_SUMMARY"
          cat docs/29_PHASE_2_ACCEPTANCE_REPORT.md "$evidence" > "$RUNNER_TEMP/phase2-acceptance.md"
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-acceptance
          path: ${{ runner.temp }}/phase2-acceptance.md
          if-no-files-found: error

      - name: Generate sanitized Phase 3 acceptance evidence
        env:
          REGRESSION_STATUS: ${{ job.status }}
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        if: always()
        shell: bash
        run: |
          frontend=$(awk '/^# pass / {print $3}' "$RUNNER_TEMP/phase2-unit.log" 2>/dev/null || true)
          chromium=$(awk '/^ *[0-9]+ passed/ {print $1}' "$RUNNER_TEMP/phase2-browser.log" 2>/dev/null || true)
          python apps/api/tests/report_ai06.py "$RUNNER_TEMP/phase3-backend.xml" "$RUNNER_TEMP/phase3-acceptance" \
            --browser-xml "$RUNNER_TEMP/phase3-browser.xml" --backend-log "$RUNNER_TEMP/phase2-backend.log" ${frontend:+--frontend "$frontend"} ${chromium:+--chromium "$chromium"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-acceptance
          path: ${{ runner.temp }}/phase3-acceptance/
          if-no-files-found: error

      - name: Verify Phase 4 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_gd05.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-acceptance
          path: ${{ runner.temp }}/phase4-acceptance.json
          if-no-files-found: error

      - name: Verify LOC-01 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_loc01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loc01-acceptance
          path: ${{ runner.temp }}/loc01-acceptance.json
          if-no-files-found: error

      - name: Verify LOC-02 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_loc02.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loc02-acceptance
          path: ${{ runner.temp }}/loc02-acceptance.json
          if-no-files-found: error

      - name: Verify LOC-03 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_loc03.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loc03-acceptance
          path: ${{ runner.temp }}/loc03-acceptance.json
          if-no-files-found: error

      - name: Verify LOC-04 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_loc04.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loc04-acceptance
          path: ${{ runner.temp }}/loc04-acceptance.json
          if-no-files-found: error

      - name: Verify LOC-05 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_loc05.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loc05-acceptance
          path: ${{ runner.temp }}/loc05-acceptance.json
          if-no-files-found: error

      - name: Verify LOC-06 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_loc06.py
      - name: Verify aggregate Phase 5 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_phase5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loc06-acceptance
          path: ${{ runner.temp }}/loc06-acceptance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-acceptance
          path: ${{ runner.temp }}/phase5-acceptance.json
          if-no-files-found: error
      - name: Verify BK-01 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_bk01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bk01-acceptance
          path: ${{ runner.temp }}/bk01-acceptance.json
          if-no-files-found: error
      - name: Verify BK-02 evidence
        if: always()
        env:
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REGRESSION_STATUS: ${{ job.status }}
        run: python apps/api/tests/report_bk02.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bk02-acceptance
          path: ${{ runner.temp }}/bk02-acceptance.json
          if-no-files-found: error
