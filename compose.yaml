services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${ROGHYAR_DB_NAME:-roghyar}
      POSTGRES_USER: ${ROGHYAR_DB_USER:-roghyar}
      POSTGRES_PASSWORD: ${ROGHYAR_DB_PASSWORD:?Copy .env.example to .env first}
      TZ: UTC
    ports:
      - "127.0.0.1:${ROGHYAR_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
